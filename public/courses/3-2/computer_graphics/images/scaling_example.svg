<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Axes -->
  <line x1="50" y1="350" x2="380" y2="350" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/> <!-- X Axis -->
  <line x1="50" y1="350" x2="50" y2="50" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/> <!-- Y Axis -->

  <!-- Arrow Marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black" />
    </marker>
  </defs>

  <!-- Original Rectangle A(1,1), B(5,1), C(5,4), D(1,4) -->
  <!-- Scale: 1 unit = 20 pixels. Origin is (50, 350). -->
  <!-- A: (50 + 20, 350 - 20) = (70, 330) -->
  <!-- B: (50 + 100, 350 - 20) = (150, 330) -->
  <!-- C: (50 + 100, 350 - 80) = (150, 270) -->
  <!-- D: (50 + 20, 350 - 80) = (70, 270) -->
  <polygon points="70,330 150,330 150,270 70,270" fill="lightblue" stroke="blue" stroke-width="2" stroke-dasharray="4"/>
  <text x="35" y="345">A(1,1)</text>
  <text x="155" y="345">B(5,1)</text>
  <text x="155" y="260">C(5,4)</text>
  <text x="35" y="260">D(1,4)</text>

  <!-- Scaled Rectangle A'(3,3), B'(15,3), C'(15,12), D'(3,12) -->
  <!-- A': (50 + 60, 350 - 60) = (110, 290) -->
  <!-- B': (50 + 300, 350 - 60) = (350, 290) -->
  <!-- C': (50 + 300, 350 - 240) = (350, 110) -->
  <!-- D': (50 + 60, 350 - 240) = (110, 110) -->
  <polygon points="110,290 350,290 350,110 110,110" fill="none" stroke="red" stroke-width="2"/>
  <text x="50" y="305">A'(3,3)</text>
  <text x="355" y="305">B'(15,3)</text>
  <text x="355" y="105">C'(15,12)</text>
  <text x="50" y="105">D'(3,12)</text>

  <!-- Projection lines from origin -->
  <line x1="50" y1="350" x2="380" y2="20" stroke="gray" stroke-dasharray="2"/>
</svg>
