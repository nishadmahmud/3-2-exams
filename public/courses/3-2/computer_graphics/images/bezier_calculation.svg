<svg width="450" height="220" viewBox="0 0 450 220" xmlns="http://www.w3.org/2000/svg">
  <!-- Grid Axis -->
  <line x1="20" y1="180" x2="400" y2="180" stroke="black"/> <!-- X Axis -->
  <line x1="20" y1="20" x2="20" y2="180" stroke="black"/> <!-- Y Axis -->
  
  <!-- Axis labels -->
  <text x="5" y="195">0</text>
  <text x="135" y="195">3</text>
  <text x="215" y="195">5</text>
  <text x="375" y="195">9</text>
  <text x="5" y="65">3</text>
  <text x="5" y="25">4</text>

  <!-- Control Lines (Convex Hull) -->
  <line x1="20" y1="180" x2="140" y2="20" stroke="gray" stroke-dasharray="4"/>
  <line x1="140" y1="20" x2="220" y2="60" stroke="gray" stroke-dasharray="4"/>
  <line x1="220" y1="60" x2="380" y2="180" stroke="gray" stroke-dasharray="4"/>
  <line x1="380" y1="180" x2="20" y2="180" stroke="gray" stroke-dasharray="4"/> <!-- Baseline -->
  
  <!-- The Curve -->
  <path d="M 20 180 C 140 20, 220 60, 380 180" fill="none" stroke="blue" stroke-width="2"/>
  
  <!-- Control Points -->
  <circle cx="20" cy="180" r="4" fill="black"/><text x="10" y="170">B₀(0,0)</text>
  <circle cx="140" cy="20" r="4" fill="black"/><text x="130" y="10">B₁(3,4)</text>
  <circle cx="220" cy="60" r="4" fill="black"/><text x="230" y="55">B₂(5,3)</text>
  <circle cx="380" cy="180" r="4" fill="black"/><text x="370" y="170">B₃(9,0)</text>

  <!-- Calculated Curve Points -->
  <circle cx="88.16" cy="107.04" r="5" fill="red"/>
  <text x="50" y="95" fill="red" font-size="12">t=0.2 (1.70, 1.82)</text>
  
  <circle cx="254.36" cy="96.84" r="5" fill="red"/>
  <text x="240" y="85" fill="red" font-size="12">t=0.7 (5.86, 2.08)</text>
</svg>
