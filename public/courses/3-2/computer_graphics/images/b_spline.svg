<svg width="500" height="200" viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Grid Axis -->
  <line x1="50" y1="150" x2="450" y2="150" stroke="black"/>
  <line x1="50" y1="50" x2="50" y2="150" stroke="black"/>
  
  <!-- Vertical Segments -->
  <line x1="130" y1="50" x2="130" y2="150" stroke="gray" stroke-dasharray="4"/>
  <line x1="210" y1="50" x2="210" y2="150" stroke="gray" stroke-dasharray="4"/>
  <line x1="290" y1="50" x2="290" y2="150" stroke="gray" stroke-dasharray="4"/>
  <line x1="370" y1="50" x2="370" y2="150" stroke="gray" stroke-dasharray="4"/>

  <!-- The undulating curve -->
  <path d="M 50 150 C 90 50, 130 50, 130 100 C 130 150, 170 150, 210 100 C 210 50, 250 50, 290 100 C 290 150, 330 150, 370 100 C 370 50, 410 50, 450 150" fill="none" stroke="blue" stroke-width="2"/>

  <!-- Points and Labels -->
  <circle cx="50" cy="150" r="3"/><text x="40" y="140">P₀</text>
  <circle cx="130" cy="60" r="3"/><text x="120" y="50">P₁</text>
  <circle cx="210" cy="140" r="3"/><text x="200" y="130">P₂</text>
  <circle cx="290" cy="60" r="3"/><text x="280" y="50">P₃</text>
  <circle cx="370" cy="140" r="3"/><text x="360" y="130">P₄</text>
  <circle cx="450" cy="150" r="3"/><text x="460" y="140">P₅</text>

  <!-- Segments -->
  <text x="80" y="170" fill="blue">Q₁</text>
  <text x="160" y="170" fill="blue">Q₂</text>
  <text x="240" y="170" fill="blue">Q₃</text>
  <text x="320" y="170" fill="blue">Q₄</text>
</svg>
