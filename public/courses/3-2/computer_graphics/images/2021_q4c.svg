<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Clipping Window -->
  <rect x="150" y="100" width="100" height="100" fill="none" stroke="black" stroke-width="2"/>
  
  <!-- P1 - P2 -->
  <line x1="120" y1="110" x2="120" y2="190" stroke="black" stroke-width="1.5"/>
  <circle cx="120" cy="110" r="2" fill="black"/><text x="100" y="105">P1</text>
  <circle cx="120" cy="190" r="2" fill="black"/><text x="100" y="200">P2</text>

  <!-- P3 - P4 -->
  <line x1="170" y1="130" x2="230" y2="160" stroke="black" stroke-width="1.5"/>
  <circle cx="170" cy="130" r="2" fill="black"/><text x="155" y="125">P3</text>
  <circle cx="230" cy="160" r="2" fill="black"/><text x="235" y="165">P4</text>

  <!-- P5 - P6 -->
  <line x1="210" y1="60" x2="240" y2="120" stroke="black" stroke-width="1.5"/>
  <circle cx="210" cy="60" r="2" fill="black"/><text x="200" y="55">P5</text>
  <circle cx="240" cy="120" r="2" fill="black"/><text x="245" y="125">P6</text>

  <!-- P7 - P8 -->
  <line x1="280" y1="160" x2="200" y2="240" stroke="black" stroke-width="1.5"/>
  <circle cx="280" cy="160" r="2" fill="black"/><text x="285" y="155">P7</text>
  <circle cx="200" cy="240" r="2" fill="black"/><text x="190" y="255">P8</text>
</svg>
