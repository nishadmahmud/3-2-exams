<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Clipping Window -->
  <rect x="100" y="100" width="200" height="100" fill="none" stroke="black" stroke-width="2"/>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black" />
    </marker>
  </defs>

  <!-- Polygon Edges with mid-point arrows -->
  <!-- A(200,50) to B(200,150) -> Midpoint: (200,100) -->
  <line x1="200" y1="50" x2="200" y2="100" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="200" y1="100" x2="200" y2="150" stroke="black" stroke-width="1.5" />

  <!-- B(200,150) to C(330,150) -> Midpoint: (265,150) -->
  <line x1="200" y1="150" x2="265" y2="150" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="265" y1="150" x2="330" y2="150" stroke="black" stroke-width="1.5" />

  <!-- C(330,150) to D(200,250) -> Midpoint: (265,200) -->
  <line x1="330" y1="150" x2="265" y2="200" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="265" y1="200" x2="200" y2="250" stroke="black" stroke-width="1.5" />

  <!-- D(200,250) to E(70,150) -> Midpoint: (135,200) -->
  <line x1="200" y1="250" x2="135" y2="200" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="135" y1="200" x2="70" y2="150" stroke="black" stroke-width="1.5" />

  <!-- E(70,150) to A(200,50) -> Midpoint: (135,100) -->
  <line x1="70" y1="150" x2="135" y2="100" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="135" y1="100" x2="200" y2="50" stroke="black" stroke-width="1.5" />

  <!-- Vertices Labels -->
  <text x="196" y="42" font-family="sans-serif" font-size="14">A</text>
  <text x="190" y="165" font-family="sans-serif" font-size="14">B</text>
  <text x="338" y="155" font-family="sans-serif" font-size="14">C</text>
  <text x="196" y="268" font-family="sans-serif" font-size="14">D</text>
  <text x="52" y="155" font-family="sans-serif" font-size="14">E</text>
</svg>
