<svg width="500" height="400" viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Back Faces -->
  <polygon points="200,200 320,200 320,80 200,80" fill="#f0f0f0" stroke="black" stroke-dasharray="4"/>
  <polygon points="200,200 120,260 120,140 200,80" fill="#f0f0f0" stroke="black" stroke-dasharray="4"/>
  
  <!-- Front Faces -->
  <polygon points="120,260 240,260 320,200 200,200" fill="none" stroke="black" stroke-width="2"/>
  <polygon points="120,260 240,260 240,140 120,140" fill="none" stroke="black" stroke-width="2"/>
  <polygon points="240,260 320,200 320,80 240,140" fill="none" stroke="black" stroke-width="2"/>
  <polygon points="120,140 240,140 320,80 200,80" fill="none" stroke="black" stroke-width="2"/>

  <!-- Axes arrows from White (200,200) -->
  <line x1="200" y1="200" x2="350" y2="200" stroke="black" stroke-width="2" marker-end="url(#arrow)"/> <!-- Cyan Axis -->
  <line x1="200" y1="200" x2="200" y2="50" stroke="black" stroke-width="2" marker-end="url(#arrow)"/> <!-- Magenta Axis -->
  <line x1="200" y1="200" x2="90" y2="282" stroke="black" stroke-width="2" marker-end="url(#arrow)"/> <!-- Yellow Axis -->
  
  <!-- Vertices Labels -->
  <text x="210" y="215" font-weight="bold">White (0,0,0)</text>
  <text x="325" y="215" font-weight="bold">Cyan (1,0,0)</text>
  <text x="210" y="70" font-weight="bold">Magenta (0,1,0)</text>
  <text x="70" y="300" font-weight="bold">Yellow (0,0,1)</text>
  
  <text x="330" y="75" font-weight="bold">Blue (1,1,0)</text>
  <text x="90" y="130" font-weight="bold">Red (0,1,1)</text>
  <text x="245" y="275" font-weight="bold">Green (1,0,1)</text>
  <text x="245" y="130" font-weight="bold">Black (1,1,1)</text>

  <!-- Arrow Marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black" />
    </marker>
  </defs>
</svg>
