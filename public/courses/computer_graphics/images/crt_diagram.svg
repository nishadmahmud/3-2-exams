<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <!-- CRT Glass Tube Envelope -->
  <path d="M 50 130 L 150 130 Q 250 130 350 50 L 520 50 L 520 250 L 350 250 Q 250 170 150 170 L 50 170 Z" fill="none" stroke="black" stroke-width="2"/>
  
  <!-- Phosphor Screen Curve -->
  <path d="M 520 50 Q 550 150 520 250" fill="none" stroke="black" stroke-width="4"/>
  <text x="540" y="150" font-family="sans-serif" font-size="14">Phosphor Screen</text>

  <!-- Electron Gun (Cathode) -->
  <rect x="50" y="140" width="30" height="20" fill="gray" stroke="black"/>
  <text x="30" y="110" font-family="sans-serif" font-size="14">Electron</text>
  <text x="40" y="125" font-family="sans-serif" font-size="14">Gun</text>

  <!-- Control Grid -->
  <rect x="90" y="135" width="10" height="30" fill="none" stroke="black" stroke-width="2"/>
  <text x="80" y="195" font-family="sans-serif" font-size="14">Control</text>
  <text x="85" y="210" font-family="sans-serif" font-size="14">Grid</text>

  <!-- Focusing Anode -->
  <rect x="120" y="135" width="20" height="30" fill="none" stroke="black" stroke-width="2"/>
  <text x="120" y="235" font-family="sans-serif" font-size="14">Focusing</text>
  <text x="125" y="250" font-family="sans-serif" font-size="14">Anode</text>
  
  <!-- Accelerating Anode -->
  <rect x="160" y="135" width="20" height="30" fill="none" stroke="black" stroke-width="2"/>
  <text x="160" y="195" font-family="sans-serif" font-size="14">Accusing</text>
  <text x="165" y="210" font-family="sans-serif" font-size="14">Anode</text>

  <!-- Vertical Deflection Plates -->
  <rect x="250" y="100" width="40" height="10" fill="black"/>
  <rect x="250" y="190" width="40" height="10" fill="black"/>
  <path d="M 270 100 L 320 60" fill="none" stroke="gray" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="55" font-family="sans-serif" font-size="14">Vertical</text>
  <text x="330" y="70" font-family="sans-serif" font-size="14">Deflection</text>
  <text x="330" y="85" font-family="sans-serif" font-size="14">Plates</text>

  <!-- Horizontal Deflection Plates -->
  <rect x="350" y="120" width="10" height="60" fill="black"/>
  <rect x="380" y="120" width="10" height="60" fill="black"/>
  <path d="M 365 180 L 300 240" fill="none" stroke="gray" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="260" font-family="sans-serif" font-size="14">Horizontal</text>
  <text x="250" y="275" font-family="sans-serif" font-size="14">Deflection</text>
  <text x="250" y="290" font-family="sans-serif" font-size="14">Plates</text>

  <!-- Electron Beam -->
  <path d="M 80 150 L 260 150 L 520 100" fill="none" stroke="blue" stroke-dasharray="4"/>

  <!-- Arrow Marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black" />
    </marker>
  </defs>
</svg>
