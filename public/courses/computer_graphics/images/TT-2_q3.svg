<svg width="500" height="400" viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Clipping Window Boundaries -->
  <!-- Vertical lines -->
  <line x1="150" y1="50" x2="150" y2="350" stroke="black" stroke-width="2"/>
  <line x1="350" y1="50" x2="350" y2="350" stroke="black" stroke-width="2"/>
  <!-- Horizontal lines -->
  <line x1="50" y1="150" x2="450" y2="150" stroke="black" stroke-width="2"/>
  <line x1="50" y1="250" x2="450" y2="250" stroke="black" stroke-width="2"/>
  
  <!-- A - A1 -->
  <line x1="120" y1="120" x2="240" y2="140" stroke="black" stroke-width="1.5"/>
  <circle cx="120" cy="120" r="3" fill="black"/><text x="110" y="110">A</text>
  <circle cx="240" cy="140" r="3" fill="black"/><text x="235" y="130">A₁</text>

  <!-- B - C -->
  <line x1="290" y1="135" x2="390" y2="280" stroke="black" stroke-width="1.5"/>
  <circle cx="290" cy="135" r="3" fill="black"/><text x="285" y="125">B</text>
  <circle cx="390" cy="280" r="3" fill="black"/><text x="395" y="295">C</text>

  <!-- D - E -->
  <line x1="130" y1="180" x2="110" y2="290" stroke="black" stroke-width="1.5"/>
  <circle cx="130" cy="180" r="3" fill="black"/><text x="115" y="175">D</text>
  <circle cx="110" cy="290" r="3" fill="black"/><text x="95" y="300">E</text>

  <!-- F - F1 -->
  <line x1="170" y1="170" x2="220" y2="210" stroke="black" stroke-width="1.5"/>
  <circle cx="170" cy="170" r="3" fill="black"/><text x="160" y="165">F</text>
  <circle cx="220" cy="210" r="3" fill="black"/><text x="225" y="205">F₁</text>

  <!-- G - H -->
  <line x1="245" y1="200" x2="270" y2="225" stroke="black" stroke-width="1.5"/>
  <circle cx="245" cy="200" r="3" fill="black"/><text x="240" y="190">G</text>
  <circle cx="270" cy="225" r="3" fill="black"/><text x="275" y="235">H</text>

  <!-- I - J -->
  <line x1="180" y1="310" x2="315" y2="225" stroke="black" stroke-width="1.5"/>
  <circle cx="180" cy="310" r="3" fill="black"/><text x="165" y="315">I</text>
  <circle cx="315" cy="225" r="3" fill="black"/><text x="320" y="220">J</text>
</svg>
