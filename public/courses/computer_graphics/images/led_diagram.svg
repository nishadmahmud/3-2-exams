<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- LED Block -->
  <rect x="80" y="100" width="240" height="80" fill="none" stroke="black" stroke-width="2"/>
  
  <!-- P-N Junction Line -->
  <line x1="200" y1="100" x2="200" y2="180" stroke="black" stroke-dasharray="4" stroke-width="2"/>

  <!-- Terminals -->
  <line x1="40" y1="140" x2="80" y2="140" stroke="black" stroke-width="2"/>
  <circle cx="35" cy="140" r="5" fill="none" stroke="black"/>
  <text x="30" y="130" font-family="sans-serif" font-size="16">+</text>

  <line x1="320" y1="140" x2="360" y2="140" stroke="black" stroke-width="2"/>
  <circle cx="365" cy="140" r="5" fill="none" stroke="black"/>
  <text x="360" y="130" font-family="sans-serif" font-size="16">-</text>

  <!-- P-type Holes (circles) -->
  <circle cx="110" cy="120" r="4" fill="none" stroke="black"/>
  <circle cx="140" cy="120" r="4" fill="none" stroke="black"/>
  <circle cx="110" cy="150" r="4" fill="none" stroke="black"/>
  <circle cx="160" cy="140" r="4" fill="none" stroke="black"/>
  <circle cx="130" cy="165" r="4" fill="none" stroke="black"/>
  <circle cx="180" cy="130" r="4" fill="none" stroke="black"/>
  <circle cx="185" cy="160" r="4" fill="none" stroke="black"/>

  <!-- N-type Electrons (solid dots) -->
  <circle cx="230" cy="120" r="4" fill="black"/>
  <circle cx="260" cy="115" r="4" fill="black"/>
  <circle cx="290" cy="130" r="4" fill="black"/>
  <circle cx="240" cy="150" r="4" fill="black"/>
  <circle cx="270" cy="165" r="4" fill="black"/>
  <circle cx="215" cy="160" r="4" fill="black"/>
  <circle cx="220" cy="135" r="4" fill="black"/>
  <circle cx="250" cy="140" r="4" fill="black"/>
  <circle cx="280" cy="150" r="4" fill="black"/>

  <!-- Light Emitted -->
  <text x="150" y="45" font-family="sans-serif" font-size="16">Light Emitted</text>
  <path d="M 140 90 L 120 60" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 170 90 L 160 60" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 200 90 L 200 60" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 230 90 L 240 60" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 260 90 L 280 60" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Labels -->
  <text x="90" y="210" font-family="sans-serif" font-size="14">P-type</text>
  <text x="85" y="230" font-family="sans-serif" font-size="14">(Anode)</text>

  <text x="180" y="210" font-family="sans-serif" font-size="14">P-N</text>
  <text x="170" y="230" font-family="sans-serif" font-size="14">Junction</text>

  <text x="250" y="210" font-family="sans-serif" font-size="14">N-type</text>
  <text x="240" y="230" font-family="sans-serif" font-size="14">(Cathode)</text>

  <!-- Legend -->
  <circle cx="90" cy="265" r="4" fill="none" stroke="black"/>
  <text x="110" y="270" font-family="sans-serif" font-size="14">Holes</text>

  <circle cx="90" cy="285" r="4" fill="black"/>
  <text x="110" y="290" font-family="sans-serif" font-size="14">Electrons</text>

  <!-- Arrow Marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black" />
    </marker>
  </defs>
</svg>
