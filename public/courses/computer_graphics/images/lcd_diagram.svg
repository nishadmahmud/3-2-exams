<svg width="500" height="300" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Layers Block -->
  <g transform="translate(50, 20)">
    <!-- Front Polarizer -->
    <rect x="0" y="0" width="120" height="20" fill="#e0e0e0" stroke="black"/>
    <line x1="0" y1="5" x2="120" y2="5" stroke="gray"/>
    <line x1="0" y1="10" x2="120" y2="10" stroke="gray"/>
    <line x1="0" y1="15" x2="120" y2="15" stroke="gray"/>

    <!-- Color Filter -->
    <rect x="0" y="25" width="120" height="20" fill="none" stroke="black"/>
    <rect x="0" y="25" width="40" height="20" fill="pink" stroke="black"/>
    <rect x="40" y="25" width="40" height="20" fill="lightgreen" stroke="black"/>
    <rect x="80" y="25" width="40" height="20" fill="lightblue" stroke="black"/>

    <!-- Front Glass -->
    <rect x="0" y="50" width="120" height="15" fill="#f5f5f5" stroke="black"/>
    
    <!-- Liquid Crystal Layer -->
    <rect x="0" y="70" width="120" height="60" fill="none" stroke="black"/>
    <!-- Liquid crystals -->
    <ellipse cx="20" cy="85" rx="8" ry="4" fill="none" stroke="black" transform="rotate(-30 20 85)"/>
    <ellipse cx="60" cy="85" rx="8" ry="4" fill="none" stroke="black" transform="rotate(-30 60 85)"/>
    <ellipse cx="100" cy="85" rx="8" ry="4" fill="none" stroke="black" transform="rotate(-30 100 85)"/>
    <ellipse cx="20" cy="115" rx="8" ry="4" fill="none" stroke="black" transform="rotate(30 20 115)"/>
    <ellipse cx="60" cy="115" rx="8" ry="4" fill="none" stroke="black" transform="rotate(30 60 115)"/>
    <ellipse cx="100" cy="115" rx="8" ry="4" fill="none" stroke="black" transform="rotate(30 100 115)"/>

    <!-- Rear Glass -->
    <rect x="0" y="135" width="120" height="15" fill="#f5f5f5" stroke="black"/>

    <!-- Rear Polarizer -->
    <rect x="0" y="155" width="120" height="20" fill="#e0e0e0" stroke="black"/>
    <line x1="20" y1="155" x2="20" y2="175" stroke="gray"/>
    <line x1="40" y1="155" x2="40" y2="175" stroke="gray"/>
    <line x1="60" y1="155" x2="60" y2="175" stroke="gray"/>
    <line x1="80" y1="155" x2="80" y2="175" stroke="gray"/>
    <line x1="100" y1="155" x2="100" y2="175" stroke="gray"/>

    <!-- Backlight -->
    <rect x="0" y="180" width="120" height="20" fill="yellow" fill-opacity="0.2" stroke="black"/>

    <!-- Arrow Marker -->
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="black" />
      </marker>
    </defs>
    
    <!-- Light Arrows on Left -->
    <path d="M -30 90 L -10 90" fill="none" stroke="black" marker-end="url(#arrow)"/>
    <text x="-40" y="95" font-family="sans-serif" font-size="12">Light</text>
    <path d="M -30 110 L -10 110" fill="none" stroke="black" marker-end="url(#arrow)"/>
    <text x="-40" y="115" font-family="sans-serif" font-size="12">Light</text>

    <!-- Labels with arrows on Right -->
    <!-- Front Polarizer -->
    <path d="M 230 10 L 130 10" fill="none" stroke="black" marker-end="url(#arrow)"/>
    <text x="240" y="15" font-family="sans-serif" font-size="14">Front Polarizer</text>

    <!-- Color Filter -->
    <path d="M 230 35 L 130 35" fill="none" stroke="black" marker-end="url(#arrow)"/>
    <text x="240" y="40" font-family="sans-serif" font-size="14">Color Filter (RGB)</text>

    <!-- Front Glass -->
    <path d="M 230 57 L 130 57" fill="none" stroke="black" marker-end="url(#arrow)"/>
    <text x="240" y="62" font-family="sans-serif" font-size="14">Front Glass (with ITO)</text>

    <!-- Liquid Crystal -->
    <path d="M 230 100 L 130 100" fill="none" stroke="black" marker-end="url(#arrow)"/>
    <text x="240" y="105" font-family="sans-serif" font-size="14">Liquid Crystal Layer</text>

    <!-- Rear Glass -->
    <path d="M 230 142 L 130 142" fill="none" stroke="black" marker-end="url(#arrow)"/>
    <text x="240" y="147" font-family="sans-serif" font-size="14">Rear Glass (with ITO)</text>

    <!-- Rear Polarizer -->
    <path d="M 230 165 L 130 165" fill="none" stroke="black" marker-end="url(#arrow)"/>
    <text x="240" y="170" font-family="sans-serif" font-size="14">Rear Polarizer</text>

    <!-- Backlight -->
    <path d="M 230 190 L 130 190" fill="none" stroke="black" marker-end="url(#arrow)"/>
    <text x="240" y="195" font-family="sans-serif" font-size="14">Backlight</text>
  </g>
</svg>
