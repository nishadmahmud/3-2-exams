<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Arrow Marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="black" />
    </marker>
  </defs>

  <!-- Frame Buffer Block -->
  <rect x="20" y="80" width="60" height="150" fill="none" stroke="black" stroke-width="2"/>
  <text x="30" y="120" font-family="sans-serif" font-size="14">Frame</text>
  <text x="30" y="140" font-family="sans-serif" font-size="14">Buffer</text>
  <text x="25" y="170" font-family="sans-serif" font-size="12">(Pixel</text>
  <text x="25" y="185" font-family="sans-serif" font-size="12">Indices)</text>

  <!-- Indices Block -->
  <rect x="120" y="80" width="40" height="150" fill="none" stroke="black" stroke-width="2"/>
  <text x="125" y="70" font-family="sans-serif" font-size="14">Index</text>
  
  <text x="135" y="100" font-family="sans-serif" font-size="14">0</text>
  <text x="135" y="120" font-family="sans-serif" font-size="14">1</text>
  <text x="135" y="140" font-family="sans-serif" font-size="14">2</text>
  <text x="135" y="170" font-family="sans-serif" font-size="14">.</text>
  <text x="135" y="180" font-family="sans-serif" font-size="14">.</text>
  <text x="135" y="190" font-family="sans-serif" font-size="14">.</text>
  <text x="135" y="210" font-family="sans-serif" font-size="14">n</text>

  <!-- Frame Buffer to Index Arrows -->
  <path d="M 80 100 L 120 100" fill="none" stroke="black" marker-end="url(#arrow)"/>
  <path d="M 80 120 L 120 120" fill="none" stroke="black" marker-end="url(#arrow)"/>
  <path d="M 80 140 L 120 140" fill="none" stroke="black" marker-end="url(#arrow)"/>
  <path d="M 80 210 L 120 210" fill="none" stroke="black" marker-end="url(#arrow)"/>

  <!-- Lookup Table -->
  <text x="230" y="40" font-family="sans-serif" font-size="14">Lookup Table</text>
  <text x="250" y="55" font-family="sans-serif" font-size="14">(LUT)</text>

  <rect x="210" y="70" width="120" height="160" fill="none" stroke="black" stroke-width="2"/>
  <line x1="260" y1="70" x2="260" y2="230" stroke="black" stroke-width="2"/>
  <line x1="210" y1="90" x2="330" y2="90" stroke="black" stroke-width="2"/>

  <text x="215" y="85" font-family="sans-serif" font-size="12">Index</text>
  <text x="275" y="80" font-family="sans-serif" font-size="12">RGB</text>
  <text x="270" y="95" font-family="sans-serif" font-size="12">Value</text>

  <!-- Table entries -->
  <text x="230" y="110" font-family="sans-serif" font-size="12">0</text>
  <text x="265" y="110" font-family="sans-serif" font-size="12">(0,0,0)</text>

  <text x="230" y="135" font-family="sans-serif" font-size="12">1</text>
  <text x="265" y="135" font-family="sans-serif" font-size="12">(255,0,0)</text>

  <text x="230" y="160" font-family="sans-serif" font-size="12">2</text>
  <text x="265" y="160" font-family="sans-serif" font-size="12">(0,255,0)</text>

  <text x="235" y="180" font-family="sans-serif" font-size="14">.</text>
  <text x="235" y="190" font-family="sans-serif" font-size="14">.</text>
  <text x="235" y="200" font-family="sans-serif" font-size="14">.</text>

  <text x="230" y="220" font-family="sans-serif" font-size="12">n</text>
  <text x="265" y="220" font-family="sans-serif" font-size="12">(255,255,255)</text>

  <!-- Index to LUT Arrows -->
  <path d="M 160 100 L 210 110" fill="none" stroke="black" marker-end="url(#arrow)"/>
  <path d="M 160 120 L 210 135" fill="none" stroke="black" marker-end="url(#arrow)"/>
  <path d="M 160 140 L 210 160" fill="none" stroke="black" marker-end="url(#arrow)"/>
  <path d="M 160 210 L 210 220" fill="none" stroke="black" marker-end="url(#arrow)"/>

  <!-- DAC Block -->
  <rect x="400" y="100" width="70" height="80" fill="none" stroke="black" stroke-width="2"/>
  <text x="415" y="120" font-family="sans-serif" font-size="14">DAC</text>
  <text x="405" y="140" font-family="sans-serif" font-size="11">(Digital to</text>
  <text x="410" y="155" font-family="sans-serif" font-size="11">Analog</text>
  <text x="405" y="170" font-family="sans-serif" font-size="11">Converter)</text>

  <!-- LUT to DAC Arrow -->
  <path d="M 330 140 L 400 140" fill="none" stroke="black" marker-end="url(#arrow)"/>

  <!-- Monitor Diagram -->
  <rect x="490" y="200" width="60" height="40" rx="5" fill="none" stroke="black" stroke-width="2"/>
  <rect x="495" y="205" width="50" height="30" rx="3" fill="none" stroke="black"/>
  <path d="M 510 240 L 510 260 L 490 260 L 490 265 L 550 265 L 550 260 L 530 260 L 530 240" fill="none" stroke="black" stroke-width="2"/>
  <text x="495" y="285" font-family="sans-serif" font-size="14">Monitor</text>

  <!-- DAC to Monitor Arrow -->
  <path d="M 435 180 L 435 220 L 485 220" fill="none" stroke="black" marker-end="url(#arrow)"/>
  <text x="445" y="195" font-family="sans-serif" font-size="12">Analog</text>
  <text x="450" y="210" font-family="sans-serif" font-size="12">RGB</text>
</svg>
