<svg width="500" height="300" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000" />
    </marker>
  </defs>

  <!-- Start Arrow -->
  <line x1="20" y1="150" x2="70" y2="150" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- q0 self loop (a) -->
  <path d="M 85 125 C 50 50, 150 50, 115 125" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="100" y="70" font-family="sans-serif" font-size="18" fill="#000" text-anchor="middle">a</text>

  <!-- q0 to q1 (a) -->
  <line x1="125" y1="133" x2="225" y2="67" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="165" y="85" font-family="sans-serif" font-size="18" fill="#000" text-anchor="middle">a</text>

  <!-- q0 to q2 (a) -->
  <line x1="125" y1="167" x2="225" y2="233" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="165" y="225" font-family="sans-serif" font-size="18" fill="#000" text-anchor="middle">a</text>

  <!-- q1 to q2 (b) -->
  <line x1="250" y1="80" x2="250" y2="220" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="260" y="155" font-family="sans-serif" font-size="18" fill="#000" text-anchor="start">b</text>

  <!-- q1 to q3 (b) -->
  <line x1="275" y1="67" x2="375" y2="133" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="335" y="85" font-family="sans-serif" font-size="18" fill="#000" text-anchor="middle">b</text>

  <!-- q2 to q3 (b) -->
  <line x1="275" y1="233" x2="375" y2="167" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  <text x="335" y="225" font-family="sans-serif" font-size="18" fill="#000" text-anchor="middle">b</text>

  <!-- Nodes -->
  <!-- q0 -->
  <circle cx="100" cy="150" r="30" fill="#fff" stroke="#000" stroke-width="2" />
  <text x="100" y="156" font-family="sans-serif" font-size="18" fill="#000" text-anchor="middle">q0</text>

  <!-- q1 -->
  <circle cx="250" cy="50" r="30" fill="#fff" stroke="#000" stroke-width="2" />
  <text x="250" y="56" font-family="sans-serif" font-size="18" fill="#000" text-anchor="middle">q1</text>

  <!-- q2 (accept) -->
  <circle cx="250" cy="250" r="30" fill="#fff" stroke="#000" stroke-width="2" />
  <circle cx="250" cy="250" r="24" fill="none" stroke="#000" stroke-width="2" />
  <text x="250" y="256" font-family="sans-serif" font-size="18" fill="#000" text-anchor="middle">q2</text>

  <!-- q3 (accept) -->
  <circle cx="400" cy="150" r="30" fill="#fff" stroke="#000" stroke-width="2" />
  <circle cx="400" cy="150" r="24" fill="none" stroke="#000" stroke-width="2" />
  <text x="400" y="156" font-family="sans-serif" font-size="18" fill="#000" text-anchor="middle">q3</text>
</svg>
